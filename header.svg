<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Deep Cyber Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#091326" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <!-- Ambient Aura Behind Map -->
    <radialGradient id="mapAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>

    <!-- Holographic Map Fill Gradient -->
    <linearGradient id="mapFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60c5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d6feb" />
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Background Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.25" />
    </pattern>

    <!-- Map Internal Hologram Scanline Pattern -->
    <pattern id="holoLines" width="10" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.18" />
    </pattern>

    <!-- Intense Neon Laser Glow Filter -->
    <filter id="laserGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feGaussianBlur stdDeviation="20" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Exact Map Vector Path with Normalized pathLength="1000" for Seamless Looping -->
    <path id="mapPath" pathLength="1000" d="M607,108 L615,112 L615,128 L626,138 L628,152 L668,178 L696,185 L720,212 L726,232 L740,250 L740,305 L746,336 L815,344 L868,372 L910,386 L936,405 L940,445 L952,466 L950,480 L936,495 L932,540 L890,560 L812,578 L818,620 L828,666 L745,682 L704,704 L732,725 L744,756 L750,772 L735,780 L756,804 L730,810 L695,818 L675,810 L642,804 L595,808 L550,825 L515,845 L495,848 L460,842 L440,848 L412,828 L382,842 L358,862 L322,865 L285,882 L265,892 L240,880 L230,842 L195,825 L165,820 L145,795 L150,772 L125,762 L100,765 L85,745 L105,725 L95,695 L75,680 L55,685 L55,665 L48,650 L60,628 L80,608 L100,595 L125,600 L145,578 L205,560 L245,535 L280,520 L318,490 L330,455 L342,435 L330,405 L322,375 L302,360 L318,345 L335,342 L395,345 L398,315 L415,275 L430,232 L448,238 L495,250 L530,250 L526,208 L532,165 L565,148 L575,118 Z" />

    <clipPath id="mapClip">
      <use href="#mapPath" />
    </clipPath>
  </defs>

  <!-- Main Card Frame -->
  <rect width="1000" height="440" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1000" height="440" rx="20" fill="url(#techGrid)" />

  <!-- Top & Bottom Cyber Frame Accents -->
  <path d="M 40 2 L 260 2" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 740 438 L 960 438" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Ambient Glow Behind Map -->
  <circle cx="760" cy="220" r="210" fill="url(#mapAura)">
    <animate attributeName="r" values="195;225;195" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Tech Radar Rings Around Map -->
  <g transform="translate(765, 225)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="8 16 40 16" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="165" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 24" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== LEFT PANEL: DEVELOPER HUD ==================== -->
  <g transform="translate(55, 65)">
    
    <!-- Live Status Pill -->
    <g>
      <rect x="0" y="0" width="295" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="18" cy="16" r="5" fill="#10b981" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="20" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
        AVAILABLE FOR COLLABORATION
      </text>
    </g>

    <!-- Greeting -->
    <text x="0" y="75" fill="#38bdf8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="2">
      ⚡ HELLO WORLD, I AM A
    </text>

    <!-- Main Title -->
    <text x="0" y="128" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Software Developer
    </text>

    <!-- Subtitle -->
    <text x="0" y="168" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="17" font-weight="400">
      Crafting clean, modern web experiences &amp; scalable code.
    </text>

    <!-- Animated Laser Divider Line -->
    <rect x="0" y="192" width="440" height="2" rx="1" fill="#1e293b" />
    <rect x="0" y="191" width="160" height="4" rx="2" fill="url(#accentGrad)" filter="url(#softGlow)">
      <animate attributeName="width" values="90;340;90" dur="4.5s" repeatCount="indefinite" />
    </rect>

    <!-- Tech Focus Pills -->
    <g transform="translate(0, 220)" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#0d1b2a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" />
      <text x="67.5" y="21" fill="#38bdf8" text-anchor="middle">&lt;CleanCode /&gt;</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="140" height="34" rx="8" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="218" y="21" fill="#e2e8f0" text-anchor="middle">Modern Web</text>

      <!-- Pill 3 -->
      <rect x="301" y="0" width="138" height="34" rx="8" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="370" y="21" fill="#e2e8f0" text-anchor="middle">Open Source</text>
    </g>

    <!-- Bottom Equalizer / Telemetry Bars -->
    <g transform="translate(0, 285)" fill="#0ea5e9" opacity="0.75">
      <rect x="0" y="10" width="4" height="14" rx="2">
        <animate attributeName="height" values="6;22;6" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="14;6;14" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="10" y="6" width="4" height="22" rx="2">
        <animate attributeName="height" values="22;8;22" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="6;13;6" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="20" y="12" width="4" height="10" rx="2">
        <animate attributeName="height" values="10;24;10" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="12;5;12" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="30" y="8" width="4" height="18" rx="2">
        <animate attributeName="height" values="18;6;18" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;14;8" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <text x="48" y="21" fill="#64748b" font-family="Consolas, monospace" font-size="12" letter-spacing="1.5">
        SYS.STATUS // ONLINE &amp; LEARNING
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: HOLOGRAPHIC MAP ==================== -->
  <g transform="translate(555, 12) scale(0.43)">
    
    <!-- 1. Deep Shadow / Outer Base Glow -->
    <use href="#mapPath" fill="#0284c7" opacity="0.25" filter="url(#laserGlow)" />

    <!-- 2. Main Map Fill -->
    <use href="#mapPath" fill="url(#mapFill)" opacity="0.92" />

    <!-- 3. Holographic Scanlines & Moving Scanner Beam Inside Map -->
    <g clip-path="url(#mapClip)">
      <rect x="0" y="0" width="1000" height="1000" fill="url(#holoLines)" />
      <!-- Moving Vertical Laser Scan Bar -->
      <rect x="0" y="-150" width="1000" height="90" fill="#ffffff" opacity="0.18" filter="url(#laserGlow)">
        <animate attributeName="y" values="-150;1000;-150" dur="7s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- 4. Crisp Inner Map Rim -->
    <use href="#mapPath" fill="none" stroke="#e0f2fe" stroke-width="3.5" opacity="0.55" />

    <!-- 5. Seamless Primary Neon Laser Runner (Cyan-White) -->
    <use href="#mapPath" fill="none" stroke="#00f2fe" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
         stroke-dasharray="160 840" filter="url(#laserGlow)">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" repeatCount="indefinite" />
    </use>
    <use href="#mapPath" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
         stroke-dasharray="130 870">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" repeatCount="indefinite" />
    </use>

    <!-- 6. Seamless Secondary Opposite Laser Runner (Electric Blue-White) -->
    <use href="#mapPath" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
         stroke-dasharray="110 890" filter="url(#laserGlow)">
      <animate attributeName="stroke-dashoffset" from="500" to="-500" dur="6s" repeatCount="indefinite" />
    </use>
    <use href="#mapPath" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
         stroke-dasharray="85 915">
      <animate attributeName="stroke-dashoffset" from="500" to="-500" dur="6s" repeatCount="indefinite" />
    </use>

  </g>

  <!-- Floating Ambient Cyber Particles -->
  <g fill="#38bdf8" filter="url(#softGlow)">
    <circle cx="570" cy="90" r="2.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="945" cy="120" r="2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="370" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="360" r="2.5">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.9s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
